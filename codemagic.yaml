workflows:
  strikeprotocol-adhoc:
    name: Strike Protocol - Direct Install Ad Hoc IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: ad_hoc
        bundle_identifier: com.gabrielprunier.strikeprotocol2026
      xcode: latest
      vars:
        XCODE_PROJECT: "StrikeProtocol.xcodeproj"
        XCODE_SCHEME: "StrikeProtocol"
    scripts:
      - name: Unpack iPhone project
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf StrikeProtocol StrikeProtocol.xcodeproj
          unzip -q StrikeProtocolProject.zip
      - name: Apply Apple signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

  strikeprotocol-testflight:
    name: Strike Protocol - TestFlight/App Store IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.gabrielprunier.strikeprotocol2026
      xcode: latest
      vars:
        XCODE_PROJECT: "StrikeProtocol.xcodeproj"
        XCODE_SCHEME: "StrikeProtocol"
    scripts:
      - name: Unpack iPhone project
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf StrikeProtocol StrikeProtocol.xcodeproj
          unzip -q StrikeProtocolProject.zip
      - name: Apply Apple signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
